<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naighborly | Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-body home-body">
    <div class="page-shell home-shell">
      <main class="single-frame-layout home-layout">
        <section class="device-frame web-frame home-frame">
          <div class="app-surface home-screen">
            <div class="home-sticky-header">
              <header class="home-hero">
                <div class="home-hero__content">
                  <div>
                    <h1>Naighborly</h1>
                    <p>Share what you have, find what you need</p>
                  </div>
                  <a class="profile-chip" href="profile.html" aria-label="Open profile">MH</a>
                </div>
              </header>

              <label class="home-search" aria-label="Search posts">
                <svg class="home-search__icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M15.5 15.5L20 20"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.8"
                  />
                  <circle
                    cx="10.5"
                    cy="10.5"
                    r="5.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                  />
                </svg>
                <input type="search" placeholder="Sema... what are you looking for?" />
              </label>
            </div>

            <div class="home-content">
              <div class="status-banner home-status-banner" id="home-status" hidden></div>
              <div class="feed home-feed" id="home-feed"></div>
            </div>

            <nav class="bottom-nav home-nav" aria-label="Primary">
              <a class="nav-item active" href="home.html" aria-current="page">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M4 10.5L12 4L20 10.5V19A1 1 0 0 1 19 20H15V14H9V20H5A1 1 0 0 1 4 19V10.5Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.8"
                  />
                </svg>
                <span>Home</span>
              </a>
              <a class="nav-plus" href="create.html" aria-label="Create a post">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M12 5V19M5 12H19"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-width="2.2"
                  />
                </svg>
              </a>
              <a class="nav-item" href="inbox.html">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M5 7.5C5 6.12 6.12 5 7.5 5H16.5C17.88 5 19 6.12 19 7.5V14.5C19 15.88 17.88 17 16.5 17H9L5 20V7.5Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.8"
                  />
                </svg>
                <span>Messages</span>
              </a>
              <a class="nav-item" href="profile.html">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M17 19A5 5 0 0 0 12 14A5 5 0 0 0 7 19"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-width="1.8"
                  />
                  <circle
                    cx="12"
                    cy="8"
                    r="3"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                  />
                </svg>
                <span>Profile</span>
              </a>
            </nav>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
