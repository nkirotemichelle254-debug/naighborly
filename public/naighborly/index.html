<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naighborly | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <section class="auth-panel auth-panel-single">
        <div class="brand-hero auth-hero">
          <h1>Naighborly</h1>
          <p>Share. Connect. Thrive together.</p>
        </div>
        <form class="auth-form" action="#" data-login-form>
          <h2>Welcome Back</h2>
          <label>
            <span>Email</span>
            <input type="email" placeholder="john@example.com" />
          </label>
          <label>
            <span>Password</span>
            <input type="password" placeholder="Enter your password" />
          </label>
          <button class="pill-button muted-button" type="submit">Sign In</button>
          <p class="auth-footnote">
            Don't have an account? <a href="home.html">Sign Up</a>
          </p>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
