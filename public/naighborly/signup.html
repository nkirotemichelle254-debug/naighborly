<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naighborly | Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <section class="auth-panel auth-panel-single">
        <div class="brand-hero auth-hero">
          <h1>Naighborly</h1>
          <p>Join trusted exchange across your neighborhood.</p>
        </div>
        <form class="auth-form" action="#" data-signup-form>
          <h2>Create account</h2>
          <p class="auth-note" data-auth-note>Browse freely, then sign up when you are ready to post, save, or message.</p>
          <label>
            <span>Name</span>
            <input type="text" placeholder="Michael Heri" data-auth-name />
          </label>
          <label>
            <span>Email</span>
            <input type="email" placeholder="john@example.com" data-auth-email />
          </label>
          <label>
            <span>Password</span>
            <input type="password" placeholder="Create a password" />
          </label>
          <p class="form-error" data-auth-error></p>
          <button class="pill-button auth-submit-button" type="submit">Sign Up</button>
          <p class="auth-footnote">
            Already have an account? <a href="index.html">Sign In</a>
          </p>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
